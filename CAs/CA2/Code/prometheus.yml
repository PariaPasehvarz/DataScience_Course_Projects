global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'kafka_consumer'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'spark_driver_gc'
    static_configs:
      - targets: ['localhost:8080']  # Port from Spark driver JMX agent

  - job_name: 'spark_executor_gc'
    static_configs:
      - targets: ['localhost:8081']  # Port from Spark executor JMX agent

